; Requêtes utilisées par l'addon ar_database.
; À copier dans @extDB3/sql_custom/adeptus.ini sur le serveur Arma.

[Default]
Version = 1
Number of Retries = 5

; Les entrées ne sont pas filtrées : le loadout contient des [ ] et des guillemets.
; Les requêtes sont préparées (?), donc pas d'injection SQL possible.
Strip Chars = ""
Strip Chars Mode = 0
Input SQF Parser = false


; Entrée : SteamID64
; Sortie : [nom, loadout, isMedic, isEngineer, isEOD]
;   le loadout est renvoyé tel quel (tableau SQF), le nom entre guillemets
[getPlayer]
SQL1_1 = SELECT name, COALESCE(loadout, '[]'), is_medic, is_engineer, is_eod FROM players WHERE steam_id = ?;
SQL1_INPUTS = 1
OUTPUT = 1-STRING, 2, 3, 4, 5


; Entrées : SteamID64, nom, loadout, isMedic, isEngineer, isEOD
[savePlayer]
SQL1_1 = INSERT INTO players (steam_id, name, loadout, is_medic, is_engineer, is_eod) VALUES (?, ?, ?, ?, ?, ?)
SQL1_2 = ON DUPLICATE KEY UPDATE name = VALUES(name), loadout = VALUES(loadout), is_medic = VALUES(is_medic), is_engineer = VALUES(is_engineer), is_eod = VALUES(is_eod);
SQL1_INPUTS = 1, 2, 3, 4, 5, 6
