; Requêtes utilisées par l'addon ar_database.
; À copier dans @extDB3/sql_custom/adeptus.ini sur le serveur Arma.

[Default]
Version = 1
Number of Retries = 5

; Les entrées ne sont pas filtrées : le loadout contient des [ ] et des guillemets.
; Les requêtes sont préparées (?), donc pas d'injection SQL possible.
Strip Chars = ""
Strip Chars Mode = 0
Input SQF Parser = false

; Deux tables :
;   players     : résumé du joueur, une ligne par steam_id (indépendant de db_mode)
;   player_data : ce qui change selon db_mode (équipement, spécialités), une ligne par db_mode et par steam_id
; db_mode = base de la mission (description.ext), "Main" par défaut.


; Entrées : db_mode, SteamID64
; Sortie : [nom, loadout, isMedic, isEngineer, isEOD, aDesDonnées]
;   - aucune ligne        : joueur inconnu
;   - aDesDonnées = 0     : joueur connu, mais rien encore dans cette base (nouvelle campagne)
;   le loadout est renvoyé tel quel (tableau SQF), le nom entre guillemets
[getPlayer]
SQL1_1 = SELECT p.name, COALESCE(d.loadout, '[]'), COALESCE(d.is_medic, 0), COALESCE(d.is_engineer, 0), COALESCE(d.is_eod, 0), d.steam_id IS NOT NULL
SQL1_2 = FROM players p LEFT JOIN player_data d ON d.steam_id = p.steam_id AND d.db_mode = ?
SQL1_3 = WHERE p.steam_id = ?;
SQL1_INPUTS = 1, 2
OUTPUT = 1-STRING, 2, 3, 4, 5, 6


; Entrées : db_mode, SteamID64, nom, loadout, isMedic, isEngineer, isEOD
; 1) résumé du joueur (créé ou mis à jour), 2) données de la base db_mode.
; Les deux requêtes passent dans le même appel, dans cet ordre (player_data dépend de players).
[savePlayer]
SQL1_1 = INSERT INTO players (steam_id, name) VALUES (?, ?)
SQL1_2 = ON DUPLICATE KEY UPDATE name = VALUES(name), last_seen = CURRENT_TIMESTAMP;
SQL1_INPUTS = 2, 3

SQL2_1 = INSERT INTO player_data (db_mode, steam_id, loadout, is_medic, is_engineer, is_eod) VALUES (?, ?, ?, ?, ?, ?)
SQL2_2 = ON DUPLICATE KEY UPDATE loadout = VALUES(loadout), is_medic = VALUES(is_medic), is_engineer = VALUES(is_engineer), is_eod = VALUES(is_eod);
SQL2_INPUTS = 1, 2, 4, 5, 6, 7
