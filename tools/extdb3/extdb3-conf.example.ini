; Exemple de configuration extDB3 pour le mod Adeptus.
; À copier en @extDB3/extdb3-conf.ini sur le serveur Arma, puis remplir la section [adeptus].

[Main]
Version = 1
; 0 = automatique
Threads = 0
Randomize Config File = false

[Log]
Flush = true

; Nom de section = DB_NAME dans addons/database/script_component.hpp
[adeptus]
IP = 127.0.0.1
Port = 3306
Username = arma
Password = changer-moi
Database = adeptus
